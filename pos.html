<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KC WATER - POS System (Supabase Cloud)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- 🔑 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { 
      font-family: 'Battambang', sans-serif; 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
    }
    body { 
      background: radial-gradient(circle at top right, #f1f5f9 0%, #e2e8f0 100%);
      margin: 0; 
      color: #1e293b;
      min-height: 100vh;
    }
    #loginPage {
      background: radial-gradient(circle at center, #f0fdf4 0%, #dcfce7 40%, #e2e8f0 100%);
    }
    #loginPage > div {
      box-shadow: 0 25px 50px -12px rgba(22, 163, 74, 0.22), 0 10px 20px -5px rgba(0, 0, 0, 0.05);
      border-radius: 2rem;
      border-top: 8px solid #15803d;
    }
    .card { 
      background: #ffffff; 
      border-radius: 1.5rem; 
      padding: 1.25rem; 
      margin-bottom: 1.25rem; 
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.06);
    }
    .dash-card { 
      background: linear-gradient(145deg, #ffffff, #f8fafc); 
      border-radius: 20px; 
      padding: 18px; 
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.05);
    }
    .btn-green { 
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
      color: white; 
      padding: 13px 20px; 
      border-radius: 1.1rem; 
      font-weight: 700; 
      width: 100%; 
      border: none; 
      cursor: pointer; 
      box-shadow: 0 5px 0 #15803d, 0 12px 20px rgba(22, 163, 74, 0.35);
      transition: all 0.15s ease;
    }
    .btn-green:active { 
      transform: translateY(4px) scale(0.98); 
      box-shadow: 0 1px 0 #15803d;
    }
    .sidebar { 
      left: 0 !important; top: 0 !important; bottom: 0 !important;
      position: fixed !important; z-index: 2000 !important; 
      height: 100vh !important; width: 275px; 
      background: linear-gradient(180deg, #14532d 0%, #166534 55%, #15803d 100%); 
      color: white; overflow-y: auto !important;
      padding-top: 75px; padding-bottom: 120px !important;
      box-shadow: 12px 0 40px rgba(0, 0, 0, 0.35);
      transform: translateX(0);
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .hidden-sidebar { transform: translateX(-100%) !important; box-shadow: none !important; }
    #sidebarBackdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); z-index: 1999; display: none; }
    #sidebarBackdrop.active { display: block !important; backdrop-filter: blur(8px); }
    @media (min-width: 1024px) { 
      #mainApp { padding-left: 275px; } 
      .sidebar { position: fixed; } 
      .hidden-sidebar { left: 0 !important; } 
      #sidebarBackdrop { display: none !important; }
    }
  </style>
</head>
<body class="bg-gray-100 overflow-x-hidden">

  <!-- ១. ផ្ទាំង LOGIN -->
  <div id="loginPage" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center border-t-8 border-green-700">
      <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-green-100 text-green-700 flex items-center justify-center text-3xl shadow-inner">
        <i class="fas fa-droplet"></i>
      </div>
      <h2 class="text-2xl font-black text-green-800 mb-1 uppercase tracking-wider">KC WATER POS</h2>
      <p class="text-xs text-gray-500 mb-6 font-bold">ប្រព័ន្ធគ្រប់គ្រងរោងចក្រទឹក (Supabase Cloud)</p>
      
      <div class="space-y-4">
        <input type="text" id="user" placeholder="ឈ្មោះអ្នកប្រើប្រាស់ (Username)" onkeyup="if(event.key==='Enter') document.getElementById('pass').focus()" class="w-full border-2 border-gray-200 rounded-2xl p-3 outline-none focus:border-green-600 focus:bg-green-50/50 font-bold text-sm">
        <input type="password" id="pass" placeholder="លេខកូដសម្ងាត់ (Password)" onkeyup="if(event.key==='Enter') login()" class="w-full border-2 border-gray-200 rounded-2xl p-3 outline-none focus:border-green-600 focus:bg-green-50/50 font-bold text-sm">
        
        <div class="flex items-center text-left text-gray-600 text-sm">
          <input type="checkbox" id="rememberMe" class="mr-2 w-4 h-4 accent-green-600 cursor-pointer">
          <label for="rememberMe" class="cursor-pointer font-bold text-xs select-none">ចងចាំខ្ញុំ (Remember Me)</label>
        </div>
        
        <button onclick="login()" id="loginBtn" class="btn-green shadow-xl active:scale-95 transition flex items-center justify-center gap-2">
          <span>ចូលប្រើប្រាស់</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ២. ផ្ទាំងធំ MAIN APP -->
  <div id="mainApp" class="hidden flex flex-col min-h-screen">
    <!-- Navbar ខាងលើ -->
    <nav class="bg-green-700 text-white p-3.5 sm:p-4 flex justify-between items-center shadow-lg sticky top-0 z-[1000]">
      <div class="flex items-center">
        <button onclick="toggleSidebar()" class="text-2xl mr-3 sm:mr-4 px-2 hover:bg-green-800 rounded transition active:scale-90" aria-label="បើកម៉ឺនុយ">
          <i class="fas fa-bars"></i>
        </button>
        <span class="font-black tracking-tight text-base sm:text-lg flex items-center gap-1.5">
          <i class="fas fa-droplet text-green-300"></i> KC WATER
        </span>
      </div>

      <div class="flex items-center gap-2">
        <button type="button" id="navOnlineOrdersBtn" onclick="showToast('មុខងារនេះនឹងរៀបចំនៅជំហានបន្ទាប់', 'info')" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-black bg-amber-400 hover:bg-amber-300 text-amber-950 shadow-md flex items-center gap-1.5 active:scale-95 transition border border-amber-300">
          <i class="fas fa-truck-fast text-xs text-amber-900"></i>
          <span class="hidden sm:inline">កុម្ម៉ង់ Online</span>
          <span id="navOnlineOrdersCount" class="w-5 h-5 rounded-full bg-red-600 text-white text-[10px] flex items-center justify-center font-black animate-pulse">0</span>
        </button>

        <div id="userInfo" class="text-[10px] bg-green-800 px-3 py-1.5 rounded-full border border-green-600 font-bold uppercase shadow-inner">Admin KC WATER</div>
      </div>
    </nav>

    <!-- តួខ្លួន Sidebar + Content -->
    <div class="flex flex-1 relative">
      <aside id="sidebar" class="sidebar shadow-2xl hidden-sidebar overflow-y-auto">
        <nav class="p-4 space-y-2" id="sidebarMenuContainer"></nav>
      </aside>
      <main class="flex-1 p-3 sm:p-4 overflow-x-hidden" id="contentArea"></main>
    </div>
  </div>

  <!-- ៣. Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-[9999] transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
    <div id="toastContent" class="bg-white border-l-4 p-4 shadow-2xl rounded-r-2xl flex items-center min-w-[260px] pointer-events-auto border-green-600">
      <span id="toastIcon" class="mr-3 text-xl text-green-600"><i class="fas fa-check-circle"></i></span>
      <span id="toastMsg" class="font-bold text-xs sm:text-sm text-gray-800"></span>
    </div>
  </div>

  <!-- ៤. Modal រើសចំនួន & តម្លៃទំនិញចូលកន្ត្រក POS -->
  <div id="productSelectModal" class="fixed inset-0 z-[4000] flex items-center justify-center p-4 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-xs" onclick="closeProductModal()"></div>
    <div class="bg-white rounded-3xl shadow-2xl z-10 w-full max-w-sm overflow-hidden p-5 space-y-3 text-center relative border">
      <button onclick="closeProductModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      <div class="w-16 h-16 mx-auto flex items-center justify-center bg-gray-50 rounded-2xl p-1.5 border shadow-inner">
        <img id="modalProdImg" src="" class="max-w-full max-h-full object-contain">
      </div>
      <div>
        <h3 id="modalProdTitle" class="font-extrabold text-gray-800 text-base leading-snug"></h3>
        <span id="modalStockStatusBadge" class="inline-block mt-0.5 text-[10px] px-2 py-0.5 bg-green-100 text-green-800 font-bold rounded-full"></span>
      </div>
      <div class="p-3 bg-blue-50/70 rounded-2xl border border-blue-200 text-left space-y-1">
        <label class="text-[10px] font-black text-blue-900 uppercase block">តម្លៃលក់ក្នុងមួយឯកតា (៛)</label>
        <input type="number" id="modalPriceInput" oninput="updateModalSubtotal()" class="w-full text-center text-xl font-black bg-white py-2 rounded-xl border border-blue-300 text-blue-900 outline-none">
      </div>
      <div class="bg-green-50/70 p-2.5 rounded-2xl border border-green-200 space-y-1">
        <label class="text-[10px] font-bold text-gray-600 uppercase block">ចំនួនទំនិញ</label>
        <div class="flex items-center justify-center gap-3">
          <button onclick="changeModalQty(-1)" class="w-11 h-10 bg-white text-red-500 border rounded-xl text-xl font-bold shadow-2xs active:scale-90">-</button>
          <input type="number" id="modalQtyInput" oninput="updateModalSubtotal()" value="1" min="1" class="w-20 h-10 text-center text-xl font-black text-green-800 bg-white border-2 border-green-300 rounded-xl outline-none">
          <button onclick="changeModalQty(1)" class="w-11 h-10 bg-green-600 text-white rounded-xl text-xl font-bold shadow-md active:scale-90">+</button>
        </div>
      </div>
      <div class="text-xs font-bold text-gray-600 flex justify-between px-2">
        <span>សរុបមុខទំនិញនេះ៖</span>
        <span id="modalSubtotalText" class="font-black text-base text-blue-700">0 ៛</span>
      </div>
      <button onclick="confirmAddToCart()" class="w-full py-3.5 btn-green shadow-md text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
        <i class="fas fa-cart-plus"></i> បញ្ចូលកន្ត្រក
      </button>
    </div>
  </div>

  <!-- ៥. Modal ABA KHQR -->
  <div id="posKhqrModal" class="fixed inset-0 z-[5000] flex items-center justify-center p-4 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-xs" onclick="closePOSKHQR()"></div>
    <div class="bg-white rounded-3xl shadow-2xl z-10 w-full max-w-sm overflow-hidden p-6 space-y-3.5 text-center relative border">
      <div class="flex justify-between items-center border-b pb-2">
        <div class="text-left"><h4 class="font-extrabold text-red-600 text-base"><i class="fas fa-qrcode"></i> ABA KHQR ផ្លូវការ</h4><p class="text-[10px] text-gray-500 font-bold">KEALY IENG</p></div>
        <button onclick="closePOSKHQR()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>
      <div class="p-1 bg-gray-50 rounded-2xl border shadow-inner">
        <img src="https://i.postimg.cc/DzHPhnmQ/photo-2026-09-06-20-44-57.jpg" class="w-56 mx-auto rounded-xl shadow-md border">
      </div>
      <div>
        <p class="text-xs text-gray-500 font-bold uppercase">ចំនួនទឹកប្រាក់ត្រូវទូទាត់</p>
        <h3 id="posKhqrAmountText" class="text-xl sm:text-2xl font-black text-green-700 mt-0.5">0 ៛</h3>
      </div>
      <button onclick="closePOSKHQR()" class="w-full py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl text-xs active:scale-95 transition">រួចរាល់ (បិទ)</button>
    </div>
  </div>

  <!-- ៦. Modal វិក្កយបត្រ (លក់ POS & ទូទាត់លុយ) -->
  <div id="posSaleReceiptModal" class="fixed inset-0 z-[5000] flex items-center justify-center p-4 hidden">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-xs" onclick="closePOSReceiptModal()"></div>
    <div class="bg-white rounded-3xl shadow-2xl z-10 w-full max-w-sm overflow-hidden p-5 space-y-3 text-center relative border">
      <h3 class="font-extrabold text-green-800 text-base flex items-center justify-center gap-2">
        <i class="fas fa-check-circle text-green-600 text-xl"></i>ប្រតិបត្តិការជោគជ័យ!
      </h3>
      <div class="max-h-72 overflow-y-auto rounded-2xl border p-1 bg-gray-50 shadow-inner">
        <img id="posModalReceiptImg" src="" class="w-full rounded-xl">
      </div>
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button onclick="sharePOSReceiptImage()" class="py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs shadow flex items-center justify-center gap-1.5 active:scale-95 transition"><i class="fas fa-share-nodes"></i> ផ្ញើ Telegram</button>
        <a id="posModalReceiptDownloadBtn" href="" download="Receipt.png" class="py-2.5 bg-gray-800 hover:bg-gray-900 text-white rounded-xl font-bold text-xs shadow flex items-center justify-center gap-1.5 active:scale-95 transition" style="text-decoration:none;"><i class="fas fa-download"></i> ទាញយក PNG</a>
      </div>
      <button onclick="closePOSReceiptModal()" class="w-full py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold rounded-xl text-xs active:scale-95 transition">បិទ (រួចរាល់)</button>
    </div>
  </div>

  <!-- កន្លែងលាក់សម្រាប់ថតវិក្កយបត្រ -->
  <div id="hidden_receipt_canvas" style="position:absolute; left:-9999px; top:-9999px;"></div>

  <!-- JAVASCRIPT: SUPABASE & FULL POS LOGIC -->
  <script>
    // 🔑 SUPABASE CLIENT CONFIGURATION
    const SUPABASE_URL = "https://ntftdylkcnkxsytptket.supabase.co";
    const SUPABASE_KEY = "sb_publishable_58qNd6IpyWqlvuI5BpuHRw__pTm7g7v";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    var currentUser = {};
    var allProducts = [];
    var allCustomers = [];
    var cart = [];
    var selectedModalProduct = null;
    var currentPosCategoryFilter = 'ALL';
    var currentPosPayMethod = 'Cash';
    var telegramConfig = { token: "", chatId: "", status: "ON" };

    // ទិន្នន័យសម្រាប់ Settlement
    var currentSettlementCustomer = "";
    var currentSettlementItems = [];
    var currentSettlementPayMode = "Cash";
    var currentSettlementOldDebt = 0;

    function showToast(msg, type) {
      type = type || 'success';
      var toast = document.getElementById('toast'), msgEl = document.getElementById('toastMsg'), iconEl = document.getElementById('toastIcon'), content = document.getElementById('toastContent');
      if (!toast || !msgEl) return;
      msgEl.innerText = msg;
      content.className = 'bg-white border-l-4 p-4 shadow-2xl rounded-r-2xl flex items-center min-w-[260px] pointer-events-auto ' + (type === 'success' ? 'border-green-600' : 'border-red-500');
      iconEl.innerHTML = type === 'success' ? '<i class="fas fa-check-circle text-green-600"></i>' : '<i class="fas fa-exclamation-circle text-red-500"></i>';
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(function() { toast.classList.add('translate-y-20', 'opacity-0'); }, 3000);
    }

    function toggleSidebar() {
      var sb = document.getElementById('sidebar');
      var bd = document.getElementById('sidebarBackdrop');
      if (!bd) {
        bd = document.createElement('div');
        bd.id = 'sidebarBackdrop';
        bd.onclick = closeSidebar;
        document.body.appendChild(bd);
      }
      if (sb) {
        if (sb.classList.contains('hidden-sidebar')) {
          sb.classList.remove('hidden-sidebar');
          if (window.innerWidth < 1024) bd.classList.add('active');
        } else { closeSidebar(); }
      }
    }

    function closeSidebar() {
      var sb = document.getElementById('sidebar');
      var bd = document.getElementById('sidebarBackdrop');
      if (sb) sb.classList.add('hidden-sidebar');
      if (bd) bd.classList.remove('active');
    }

    // ✅ មុខងារ LOGIN
    async function login() {
      var userEl = document.getElementById('user');
      var passEl = document.getElementById('pass');
      var btnEl = document.getElementById('loginBtn');
      var remEl = document.getElementById('rememberMe');
      if (!userEl || !passEl) return;

      var u = userEl.value.trim();
      var p = passEl.value.trim();
      if (!u || !p) { showToast("សូមបញ្ចូល Username និង Password!", "error"); return; }

      btnEl.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> កំពុងផ្ទៀងផ្ទាត់...';
      btnEl.disabled = true;

      try {
        const { data, error } = await supabaseClient
          .from('users')
          .select('*')
          .eq('username', u)
          .eq('password', p)
          .maybeSingle();

        if (error) throw error;

        if (data) {
          currentUser = {
            id: data.id,
            username: data.username,
            fullName: data.full_name,
            role: data.role,
            type: data.type,
            phone: data.phone,
            linkedBoss: data.linked_boss || ""
          };

          if (remEl && remEl.checked) {
            localStorage.setItem('kc_pos_user', u);
            localStorage.setItem('kc_pos_pass', p);
          } else {
            localStorage.removeItem('kc_pos_user');
            localStorage.removeItem('kc_pos_pass');
          }

          document.getElementById('loginPage').style.display = 'none';
          document.getElementById('mainApp').classList.remove('hidden');
          document.getElementById('userInfo').innerText = currentUser.role + "៖ " + currentUser.fullName;

          renderSidebarMenu();
          await loadSettingsAndTelegram();
          await fetchInitialPOSData();
          loadModule('Dashboard');
          showToast("ចូលប្រើប្រាស់ជោគជ័យ! សួស្តី " + currentUser.fullName, "success");
        } else {
          showToast("ឈ្មោះ ឬលេខសម្ងាត់មិនត្រឹមត្រូវឡើយ!", "error");
        }
      } catch (err) {
        showToast("កំហុសតភ្ជាប់៖ " + err.message, "error");
      } finally {
        btnEl.innerHTML = '<span>ចូលប្រើប្រាស់</span>';
        btnEl.disabled = false;
      }
    }

    async function loadSettingsAndTelegram() {
      try {
        const { data } = await supabaseClient.from('settings').select('*');
        if (data) {
          data.forEach(function(r) {
            if (r.key === 'Telegram_Token') telegramConfig.token = r.value;
            if (r.key === 'Telegram_ChatID') telegramConfig.chatId = r.value;
            if (r.key === 'Telegram_Alert_Status') telegramConfig.status = r.value;
          });
        }
      } catch(e) {}
    }

    async function sendTelegramAlert(message) {
      if (!telegramConfig.token || !telegramConfig.chatId || telegramConfig.status === 'OFF') return;
      try {
        await fetch("https://api.telegram.org/bot" + telegramConfig.token + "/sendMessage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ chat_id: telegramConfig.chatId, text: message, parse_mode: "HTML" })
        });
      } catch(e) {}
    }

    function renderSidebarMenu() {
      var sNav = document.getElementById('sidebarMenuContainer');
      if (!sNav) return;
      var html = '';

      if (currentUser.role === 'Admin') {
        html += '<button onclick="loadModule(\'Dashboard\')" class="w-full text-left p-3 hover:bg-green-700 rounded-xl transition flex items-center font-bold"><i class="fas fa-chart-pie mr-3 w-5 text-center"></i>Dashboard</button>';
        html += '<div class="text-[10px] font-bold text-green-300 uppercase px-3 pt-3 pb-1 opacity-80 tracking-wider">ការលក់ & ទូទាត់</div>';
        html += '<button onclick="loadModule(\'POS\')" class="w-full text-left p-3 hover:bg-green-700 rounded-xl transition flex items-center font-bold"><i class="fas fa-shopping-cart mr-3 w-5 text-center"></i>ផ្ទាំងលក់ (POS)</button>';
        html += '<button onclick="loadModule(\'Settlement\')" class="w-full text-left p-3 hover:bg-green-700 rounded-xl transition flex items-center font-bold"><i class="fas fa-calculator mr-3 w-5 text-center"></i>ទូទាត់លុយ (Settlement)</button>';
      } else {
        html += '<button onclick="loadModule(\'POS\')" class="w-full text-left p-3 hover:bg-green-700 rounded-xl transition flex items-center font-bold"><i class="fas fa-shopping-cart mr-3 w-5 text-center"></i>ផ្ទាំងលក់ (POS)</button>';
      }

      html += '<hr class="border-green-800 my-3">';

    async function loadDashboardData() {
      try {
        var today = new Date().toISOString().split('T')[0];
        const { data: trans } = await supabaseClient.from('transactions').select('*').gte('created_at', today + 'T00:00:00Z');
        
        var todaySalesKHR = 0;
        var todayCashKHR = 0;
        var prodQty = {};

        if (trans) {
          trans.forEach(function(t) {
            todaySalesKHR += parseFloat(t.total || 0);
            todayCashKHR += parseFloat(t.paid_khr || 0);
            if (t.product_name) {
              prodQty[t.product_name] = (prodQty[t.product_name] || 0) + parseFloat(t.qty || 0);
            }
          });
        }

        document.getElementById('dashTodaySales').innerText = '៛ ' + todaySalesKHR.toLocaleString();
        document.getElementById('dashTodayCash').innerText = '៛ ' + todayCashKHR.toLocaleString();

        const { data: unpaids } = await supabaseClient.from('transactions').select('total').eq('status', 'Unpaid');
        var debtTotal = 0;
        if (unpaids) unpaids.forEach(function(u) { debtTotal += parseFloat(u.total || 0); });
        document.getElementById('dashTotalDebt').innerText = '៛ ' + debtTotal.toLocaleString();

        var pqArea = document.getElementById('dashProductQtyArea');
        var pqHtml = "";
        for (var p in prodQty) {
          pqHtml += '<div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl border"><span class="font-bold text-gray-800">' + p + '</span><span class="px-3 py-1 bg-blue-100 text-blue-800 font-black rounded-lg">' + prodQty[p] + '</span></div>';
        }
        pqArea.innerHTML = pqHtml || '<p class="text-gray-400 italic text-center py-4">មិនទាន់មានការលក់ថ្ងៃនេះនៅឡើយទេ</p>';

        var alertArea = document.getElementById('dashStockAlertArea');
        var saHtml = "";
        allProducts.forEach(function(prod) {
          var isLow = parseFloat(prod.stock || 0) <= parseFloat(prod.min_stock || 5);
          saHtml += '<div class="flex justify-between items-center p-2.5 bg-gray-50 rounded-xl border"><span><b>' + prod.name + '</b></span><span class="px-2.5 py-1 font-black rounded-lg ' + (isLow ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700') + '">' + prod.stock + ' ឯកតា</span></div>';
        });
        alertArea.innerHTML = saHtml || '<p class="text-gray-400 italic text-center py-4">គ្មានទិន្នន័យស្តុក</p>';
      } catch(e) {}
    }

    function setPosCategoryFilter(cat) {
      currentPosCategoryFilter = cat;
      ['ALL', 'BARREL', 'PACK'].forEach(function(t) {
        var btn = document.getElementById('catTab_' + t);
        if (!btn) return;
        if (t === cat) btn.className = "px-3.5 py-2 rounded-xl text-xs font-bold bg-green-700 text-white shadow-md active:scale-95 transition";
        else btn.className = "px-3.5 py-2 rounded-xl text-xs font-bold bg-white text-gray-700 border hover:bg-gray-50 active:scale-95 transition";
      });
      rPG();
    }

    function rPG() {
      var grid = document.getElementById('pGrid');
      if (!grid) return;
      var html = '';

      var filtered = allProducts.filter(function(p) {
        if (p.channel === 'ONLINE') return false;
        var nameLower = (p.name || '').toLowerCase();
        if (currentPosCategoryFilter === 'BARREL') return (nameLower.indexOf('ធុង') !== -1 || nameLower.indexOf('20l') !== -1);
        if (currentPosCategoryFilter === 'PACK') return (nameLower.indexOf('យួរ') !== -1 || nameLower.indexOf('ដប') !== -1);
        return true;
      });

      filtered.forEach(function(p) {
        var imgUrl = p.img || "https://cdn-icons-png.flaticon.com/512/3100/3100566.png";
        html += '<div onclick="openProductModal(\'' + p.id + '\')" class="bg-white p-3 rounded-2xl shadow-sm hover:shadow-xl border border-gray-100 hover:border-green-400 transition-all cursor-pointer active:scale-95 flex flex-col items-center justify-between text-center relative group">' +
          '<span class="absolute top-2 right-2 bg-green-100 text-green-800 text-[9px] font-bold px-1.5 py-0.2 rounded-full">សល់ ' + p.stock + '</span>' +
          '<div class="w-16 h-16 sm:w-20 sm:h-20 flex items-center justify-center mb-1"><img src="' + imgUrl + '" class="max-w-full max-h-full object-contain drop-shadow-sm"></div>' +
          '<h4 class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-2 h-8 flex items-center justify-center">' + p.name + '</h4>' +
          '<p class="text-xs sm:text-sm font-extrabold text-green-600 mt-1">' + Number(p.price || 0).toLocaleString() + ' ៛</p>' +
          '<div class="mt-2 w-full py-1.5 bg-green-50 group-hover:bg-green-600 text-green-700 group-hover:text-white rounded-xl text-xs font-bold transition-colors flex items-center justify-center gap-1"><i class="fas fa-plus text-[10px]"></i> រើសទិញ</div>' +
        '</div>';
      });

      grid.innerHTML = html || '<p class="col-span-full py-8 text-center text-gray-400 text-xs italic">មិនមានទំនិញក្នុងប្រភេទនេះឡើយ</p>';
    }

    function openProductModal(id) {
      var p = allProducts.find(function(item) { return item.id === id; });
      if (!p) return;
      selectedModalProduct = p;

      document.getElementById('modalProdImg').src = p.img || "https://cdn-icons-png.flaticon.com/512/3100/3100566.png";
      document.getElementById('modalProdTitle').innerText = p.name;
      document.getElementById('modalStockStatusBadge').innerText = "សល់ក្នុងស្តុក៖ " + p.stock;
      document.getElementById('modalPriceInput').value = p.price || 0;
      document.getElementById('modalQtyInput').value = 1;
      updateModalSubtotal();
      document.getElementById('productSelectModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productSelectModal').classList.add('hidden');
      selectedModalProduct = null;
    }

    function changeModalQty(delta) {
      var inp = document.getElementById('modalQtyInput');
      var val = (parseInt(inp.value) || 1) + delta;
      if (val < 1) val = 1;
      inp.value = val;
      updateModalSubtotal();
    }

    function updateModalSubtotal() {
      var q = parseFloat(document.getElementById('modalQtyInput').value || 1);
      var p = parseFloat(document.getElementById('modalPriceInput').value || 0);
      document.getElementById('modalSubtotalText').innerText = Number(q * p).toLocaleString() + ' ៛';
    }

    function confirmAddToCart() {
      if (!selectedModalProduct) return;
      var q = parseInt(document.getElementById('modalQtyInput').value) || 1;
      var pr = parseFloat(document.getElementById('modalPriceInput').value) || 0;

      cart.push({
        id: selectedModalProduct.id,
        name: selectedModalProduct.name,
        price: pr,
        qty: q,
        currency: "KHR"
      });

      closeProductModal();
      rC();
      showToast("បានបញ្ចូលទំនិញក្នុងកន្ត្រក!", "success");
    }

    function rC() {
      var tbody = document.getElementById('cItemsTableBody');
      var totalValEl = document.getElementById('cTotalVal');
      var badge = document.getElementById('cartCountBadge');

      if (!tbody) return;
      if (cart.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400 italic">កន្ត្រកទទេ</td></tr>';
        if (totalValEl) totalValEl.innerText = "0 ៛";
        if (badge) badge.innerText = "0 មុខ";
        calcPOSChange();
        return;
      }

      var html = '', total = 0;
      cart.forEach(function(i, idx) {
        var sub = i.qty * i.price;
        total += sub;
        html += '<tr class="border-b hover:bg-gray-50">' +
          '<td class="p-2.5 font-bold text-gray-800">' + i.name + '</td>' +
          '<td class="p-2.5 text-center font-bold text-blue-700">' + i.qty + '</td>' +
          '<td class="p-2.5 text-right">' + Number(i.price).toLocaleString() + '</td>' +
          '<td class="p-2.5 text-right font-black text-green-700">' + Number(sub).toLocaleString() + ' ៛</td>' +
          '<td class="p-2.5 text-center"><button onclick="cart.splice(' + idx + ', 1); rC();" class="text-red-400 hover:text-red-600 p-1"><i class="fas fa-trash-can"></i></button></td>' +
        '</tr>';
      });

      tbody.innerHTML = html;
      badge.innerText = cart.length + " មុខ";
      totalValEl.innerText = Number(total).toLocaleString() + " ៛";
      calcPOSChange();
    }

    function getCartTotal() {
      return cart.reduce(function(sum, i) { return sum + (i.qty * i.price); }, 0);
    }

    function calcPOSChange() {
      var area = document.getElementById('posChangeArea');
      if (!area) return;
      var total = getCartTotal();
      var paid = parseFloat(document.getElementById('pK') ? document.getElementById('pK').value || 0 : 0);

      if (total === 0 || paid === 0) { area.classList.add('hidden'); return; }
      var diff = paid - total;

      if (diff > 0) {
        area.className = 'p-3 rounded-xl font-bold text-center border-2 bg-green-100 text-green-900 border-green-400';
        area.innerHTML = '<div class="text-[11px] uppercase text-green-700 font-bold mb-0.5">ប្រាក់អាប់ជូនភ្ញៀវវិញ</div><div class="text-lg font-black text-green-800">៛ ' + diff.toLocaleString() + '</div>';
        area.classList.remove('hidden');
      } else if (diff < 0) {
        area.className = 'p-3 rounded-xl font-bold text-center border-2 bg-orange-100 text-orange-900 border-orange-400';
        area.innerHTML = '<div class="text-[11px] uppercase text-orange-700 font-bold mb-0.5">ប្រាក់នៅខ្វះ</div><div class="text-lg font-black text-orange-800">៛ ' + Math.abs(diff).toLocaleString() + '</div>';
        area.classList.remove('hidden');
      } else {
        area.className = 'p-2.5 rounded-xl font-bold text-center border-2 bg-blue-100 text-blue-900 border-blue-300';
        area.innerHTML = '<i class="fas fa-check-circle text-blue-600 mr-1.5"></i> បង់លុយគ្រប់ចំនួន';
        area.classList.remove('hidden');
      }
    }

    function fillExactPOSPay() {
      var tot = getCartTotal();
      if (document.getElementById('pK')) document.getElementById('pK').value = tot > 0 ? tot : "";

    async function loadSettlementDebtorsList() {
      var badgesContainer = document.getElementById('settleDebtorsBadgesContainer');
      if (!badgesContainer) return;

      try {
        const { data: unpaids } = await supabaseClient
          .from('transactions')
          .select('customer_name, total')
          .eq('status', 'Unpaid');

        if (!unpaids || unpaids.length === 0) {
          badgesContainer.innerHTML = '<span class="text-green-600 font-bold text-xs"><i class="fas fa-check-circle mr-1"></i> អបអរសាទរ! គ្មានអតិថិជនណាជំពាក់ប្រាក់ឡើយ</span>';
          return;
        }

        var custMap = {};
        unpaids.forEach(function(u) {
          var cName = (u.customer_name || "").trim();
          if (cName && cName !== "Walk-in") {
            custMap[cName] = (custMap[cName] || 0) + parseFloat(u.total || 0);
          }
        });

        var html = '';
        for (var name in custMap) {
          html += '<button onclick="selectCustomerForSettlement(\'' + name.replace(/'/g, "\\'") + '\')" class="px-3.5 py-2 bg-white hover:bg-blue-50 text-blue-900 rounded-xl border border-blue-200 font-bold shadow-2xs active:scale-95 transition flex items-center gap-1.5">' +

          '</button>';
        }

    }

    function toggleSelectAllSettle(isChecked) {
      document.querySelectorAll('.settle-item-cb').forEach(function(cb) { cb.checked = isChecked; });

    function getSelectedSettlementTotal() {
      var sum = 0;
      document.querySelectorAll('.settle-item-cb:checked').forEach(function(cb) {
        sum += parseFloat(cb.getAttribute('data-total') || 0);
      });
      return sum;
    }

    function recalcSettlementCalculation() {
      var sub = getSelectedSettlementTotal();
      var count = document.querySelectorAll('.settle-item-cb:checked').length;
      var totalDue = sub + currentSettlementOldDebt;

      document.getElementById('settleSelectedCountBadge').innerText = count + ' ជើងទឹក';
      document.getElementById('settleSelectedSubtotal').innerText = '៛ ' + sub.toLocaleString();
      document.getElementById('settleTotalDueText').innerText = '៛ ' + totalDue.toLocaleString();

      calcSettleChange();
    }

    function fillExactSettlementPay() {
      var sub = getSelectedSettlementTotal();
      var totalDue = sub + currentSettlementOldDebt;
      document.getElementById('settlePaidInput').value = totalDue > 0 ? totalDue : "";
      calcSettleChange();
    }

    function calcSettleChange() {
      var area = document.getElementById('settleChangeArea');
      if (!area) return;

      var sub = getSelectedSettlementTotal();
      var totalDue = sub + currentSettlementOldDebt;
      var paid = parseFloat(document.getElementById('settlePaidInput').value || 0);

      if (paid === 0 || totalDue === 0) { area.classList.add('hidden'); return; }
      var diff = paid - totalDue;

      if (diff > 0) {
        area.className = 'p-3 rounded-xl font-bold text-center border-2 bg-green-100 text-green-900 border-green-400';
        area.innerHTML = '<div class="text-[11px] uppercase text-green-700 font-bold mb-0.5">ប្រាក់អាប់ជូនវិញ</div><div class="text-lg font-black text-green-800">៛ ' + diff.toLocaleString() + '</div>';
        area.classList.remove('hidden');
      } else if (diff < 0) {
        area.className = 'p-3 rounded-xl font-bold text-center border-2 bg-orange-100 text-orange-900 border-orange-400';
        area.innerHTML = '<div class="text-[11px] uppercase text-orange-700 font-bold mb-0.5">នៅជំពាក់សល់</div><div class="text-lg font-black text-orange-800">៛ ' + Math.abs(diff).toLocaleString() + '</div>';
        area.classList.remove('hidden');
      } else {
        area.className = 'p-2.5 rounded-xl font-bold text-center border-2 bg-blue-100 text-blue-900 border-blue-300';
        area.innerHTML = '<i class="fas fa-check-circle text-blue-600 mr-1.5"></i> បង់លុយគ្រប់ចំនួន (គ្មានជំពាក់សល់)';
        area.classList.remove('hidden');
      }
    }

    async function submitSettlementPayment() {
      if (isSubmittingSettleLock) return;

      var checkedCbs = document.querySelectorAll('.settle-item-cb:checked');
      var selectedIds = [];
      checkedCbs.forEach(function(cb) { selectedIds.push(parseInt(cb.getAttribute('data-id'))); });

      var sub = getSelectedSettlementTotal();
      var totalDue = sub + currentSettlementOldDebt;
      var paid = parseFloat(document.getElementById('settlePaidInput').value || 0);

      if (selectedIds.length === 0 && currentSettlementOldDebt === 0) {
        showToast("សូមធីកជ្រើសរើសយ៉ាងហោចណាស់ ១ ជួរដើម្បីទូទាត់!", "error"); return;
      }
      if (paid === 0) {
        showToast("សូមបញ្ចូលចំនួនប្រាក់ដែលបានបង់!", "error"); return;
      }

      var remainingBalance = Math.max(0, totalDue - paid);
      var btn = document.getElementById('btnSubmitSettlement');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i> កំពុងទូទាត់ប្រាក់...';
      isSubmittingSettleLock = true;

      try {
        // ១. ប្តូរ status ទៅ 'Paid' ក្នុង transactions table
        if (selectedIds.length > 0) {
          const { error: updErr } = await supabaseClient
            .from('transactions')
            .update({ status: 'Paid' })
            .in('id', selectedIds);
          if (updErr) throw updErr;
        }

        // ២. កត់ត្រាចូល settlements table ក្នុង Supabase
        const { error: setErr } = await supabaseClient.from('settlements').insert([{
          customer_name: currentSettlementCustomer,
          total_due_khr: totalDue,
          paid_khr: Math.min(paid, totalDue),
          balance_khr: remainingBalance,
          admin_name: currentUser.fullName || "Admin",
          pay_method: currentSettlementPayMode,
          cash_khr: (currentSettlementPayMode === 'Cash') ? paid : 0,
          scan_khr: (currentSettlementPayMode === 'ABA') ? paid : 0
        }]);
        if (setErr) throw setErr;

        // ៣. បាញ់ Telegram Alert
        try {
          var tgMsg = "🙏 <b>[KC WATER - ទូទាត់ប្រាក់ជោគជ័យ]</b>\n\n" +
                      "👤 <b>អតិថិជន៖</b> " + currentSettlementCustomer + "\n" +
                      "💳 <b>វិធីទូទាត់៖</b> " + (currentSettlementPayMode === 'ABA' ? '📱 ស្កេន ABA' : '💵 លុយសុទ្ធ') + "\n" +
                      "💰 <b>សរុបត្រូវបង់៖</b> <b>៛ " + totalDue.toLocaleString() + "</b>\n" +
                      "✅ <b>ប្រាក់បានបង់៖</b> <b>៛ " + paid.toLocaleString() + "</b>\n" +
                      "⚠️ <b>នៅជំពាក់សល់៖</b> <b>៛ " + remainingBalance.toLocaleString() + "</b>\n" +
                      "✍️ <b>អ្នកទទួល៖</b> " + (currentUser.fullName || "Admin") + "\n" +
                      "🕒 <b>ម៉ោង៖</b> " + new Date().toLocaleTimeString('km-KH');
          sendTelegramAlert(tgMsg);
        } catch(e) {}

        // ៤. បង្កើតវិក្កយបត្ររូបភាព (Receipt PNG)
        var receiptItems = currentSettlementItems.filter(function(i){ return selectedIds.indexOf(i.id) !== -1; });
        generateReceiptImage("SET-" + new Date().getTime(), currentSettlementCustomer, totalDue, paid, receiptItems, "វិក្កយបត្រទូទាត់ប្រាក់ (SETTLEMENT)");

        showToast("បានទូទាត់ប្រាក់ និងជម្រះបញ្ជីជោគជ័យ!", "success");
        confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

        // Refresh ឡើងវិញ
        document.getElementById('settlementDetailCard').classList.add('hidden');
        await loadSettlementDebtorsList();

      } catch(err) {
        showToast("កំហុសទូទាត់ប្រាក់៖ " + err.message, "error");
      } finally {
        isSubmittingSettleLock = false;
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-file-invoice-dollar text-xl"></i> ទូទាត់ & ចេញវិក្កយបត្រ (Save Settlement)';
      }
    }

    // មុខងារបង្កើតរូបវិក្កយបត្រ (កែសម្រួលគាំទ្រទាំង Sale & Settlement)
    function generateReceiptImage(tid, cust, total, paid, items, titleText) {
      var dateStr = new Date().toLocaleString('km-KH');
      var change = Math.max(0, paid - total);

      var itemsHtml = '';
      (items || []).forEach(function(i) {
        var pName = i.name || i.product_name || "ទំនិញ";
        var tot = (i.qty * i.price);
        itemsHtml += '<tr style="border-bottom:1px dashed #cbd5e1;">' +
          '<td style="padding:6px 4px;">' + pName + '</td>' +
          '<td align="center" style="padding:6px 4px; font-weight:bold; color:#1d4ed8;">' + i.qty + '</td>' +
          '<td align="right" style="padding:6px 4px; font-weight:bold;">' + tot.toLocaleString() + ' ៛</td>' +
        '</tr>';
      });

      var h = '<div id="pos-canvas-box" style="width:360px; padding:20px; background:white; color:#0f172a; font-family:\'Battambang\', sans-serif; border-radius:12px;">' +
        '<div style="text-align:center; border-bottom:2px dashed #16a34a; padding-bottom:8px; margin-bottom:10px;">' +
          '<b style="font-size:16px; color:#15803d;">KC WATER</b><br>' +
          '<span style="font-size:11px; color:#64748b; font-weight:bold;">' + (titleText || 'វិក្កយបត្រ (RECEIPT)') + '</span>' +
        '</div>' +
        '<div style="font-size:10.5px; line-height:1.6; margin-bottom:10px; color:#334155;">' +
          'លេខកូដ៖ <b>' + tid + '</b><br>' +
          'អតិថិជន៖ <b>' + cust + '</b><br>' +
          'កាលបរិច្ឆេទ៖ ' + dateStr + '<br>' +
          'អ្នកទទួល/គិតលុយ៖ <b>' + (currentUser.fullName || "Admin") + '</b>' +
        '</div>' +
        '<table style="width:100%; font-size:11px; border-collapse:collapse; margin-bottom:10px;">' +
          '<tr style="background:#f1f5f9; color:#475569; border-bottom:1px solid #cbd5e1;"><th align="left" style="padding:5px 4px;">ទំនិញ</th><th align="center" style="padding:5px 4px;">ចំនួន</th><th align="right" style="padding:5px 4px;">សរុប</th></tr>' +
          (itemsHtml || '<tr><td colspan="3" align="center" style="padding:10px; color:#94a3b8;">ទូទាត់បំណុលចាស់</td></tr>') +
        '</table>' +
        '<div style="background:#f0fdf4; padding:10px; border-radius:8px; font-size:11px; line-height:1.7; border:1px solid #bbf7d0;">' +
          '<div style="display:flex; justify-content:space-between; font-weight:bold;"><span>សរុបត្រូវបង់៖</span><b>៛ ' + total.toLocaleString() + '</b></div>' +
          '<div style="display:flex; justify-content:space-between; color:#1d4ed8;"><span>ប្រាក់ទទួលបាន៖</span><b>៛ ' + paid.toLocaleString() + '</b></div>' +
          (change > 0 ? '<div style="display:flex; justify-content:space-between; color:#15803d; font-weight:bold; border-top:1px dashed #86efac; padding-top:4px; margin-top:4px;"><span>ប្រាក់អាប់ជូនវិញ៖</span><b>៛ ' + change.toLocaleString() + '</b></div>' : '') +
        '</div>' +
        '<div style="text-align:center; margin-top:12px; border-top:1px dashed #cbd5e1; padding-top:8px;">' +
          '<span style="font-size:9.5px; color:#64748b;">សូមអរគុណ! សូមអញ្ជើញមកពិសាម្តងទៀត 🙏</span>' +
        '</div>' +
      '</div>';

      var hiddenArea = document.getElementById('hidden_receipt_canvas');
      hiddenArea.innerHTML = h;

      html2canvas(document.getElementById('pos-canvas-box'), { scale: 3 }).then(function(canvas) {
        var imgUrl = canvas.toDataURL("image/png");
        document.getElementById('posModalReceiptImg').src = imgUrl;
        document.getElementById('posModalReceiptDownloadBtn').href = imgUrl;
        document.getElementById('posSaleReceiptModal').classList.remove('hidden');
      });
    }

    function closePOSReceiptModal() { document.getElementById('posSaleReceiptModal').classList.add('hidden'); }
    function sharePOSReceiptImage() {
      var img = document.getElementById('posModalReceiptImg');
      if (img && navigator.share) {
        fetch(img.src).then(r => r.blob()).then(blob => {
          navigator.share({ files: [new File([blob], 'Receipt.png', { type: 'image/png' })], title: 'វិក្កយបត្រ KC WATER' });
        });
      } else {
        document.getElementById('posModalReceiptDownloadBtn').click();
      }
    }

    // Auto-login
    window.addEventListener('load', function() {
      var savedU = localStorage.getItem('kc_pos_user');
      var savedP = localStorage.getItem('kc_pos_pass');
      if (savedU && savedP) {
        document.getElementById('user').value = savedU;
        document.getElementById('pass').value = savedP;
        document.getElementById('rememberMe').checked = true;
        login();
      }
    });
  </script>
</body>
</html>
